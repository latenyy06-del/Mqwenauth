  - "§c════════════════════════════════════════"
  - "§c╔════════════ LunexVanilla ════════════╗"
  - "§c║"
  - "§c║  §fHoş geldiniz sunucumuza!"
  - "§c║"
  - "§c║  §cEğer hesabınız varsa:"
  - "§c║  §f/login <şifre>"
  - "§c║"
  - "§c║  §cYeni hesap oluşturmak için:"
  - "§c║  §f/register <şifre> <şifre-tekrar>"
  - "§c║"
  - "§c╚════════════════════════════════════════╝"
  - "§c════════════════════════════════════════"

login-success: "§c✓ §fGiriş başarılı! Sunucuya hoş geldiniz!"
login-failed: "§c❌ §fŞifre hatalı! Lütfen tekrar deneyin."
register-success: "§c✓ §fKayıt başarılı! Sunucuya hoş geldiniz."
