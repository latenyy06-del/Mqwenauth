# Mqwenauth Plugin Yapılandırması

lobby-world: mqwenauth_lobby
main-world: world

min-password-length: 3
max-password-length: 32

rate-limit-attempts: 3
rate-limit-seconds: 30

lobby-spawn:
  x: 0.5
  y: 64
  z: 0.5
  yaw: 0
  pitch: 0

